<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="todo-app">
        <h2>My To-Do List 📝</h2>

        <!-- input row to capture new tasks -->
        <div class="input-row">
            <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="60">
            <button id="addBtn">Add</button>
        </div>

        <!-- dynamic task list -->
        <ul id="taskList"></ul>

        <!-- task counter -->
        <div class="footer">
            <span id="taskCount">0 tasks remaining</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
